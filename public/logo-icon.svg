<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
  <!-- Yellow shackle -->
  <path d="M 22 90 A 58 58 0 0 1 138 90"
        fill="none" stroke="#FFB200" stroke-width="23" stroke-linecap="butt"/>

  <!-- Blue body -->
  <rect x="8" y="80" width="144" height="120" fill="#000957"/>

  <!-- Top white band (full width) -->
  <rect x="8" y="80" width="144" height="11" fill="white"/>
  <!-- 2nd white band (full width) -->
  <rect x="8" y="99" width="144" height="8" fill="white"/>

  <!-- Left outer vertical (full body height) -->
  <rect x="8" y="80" width="11" height="120" fill="white"/>
  <!-- Left inner vertical (stops at 75% of body) -->
  <rect x="28" y="91" width="9" height="78" fill="white"/>
  <!-- Horizontal connector (links both left verticals at bottom of inner) -->
  <rect x="8" y="169" width="46" height="9" fill="white"/>

  <!-- Right outer vertical (full body height) -->
  <rect x="141" y="80" width="11" height="120" fill="white"/>

  <!-- Bottom white band (full width) -->
  <rect x="8" y="189" width="144" height="11" fill="white"/>

  <!-- Yellow shutter slats -->
  <rect x="44" y="110" width="84" height="18" rx="2" fill="#FFB200"/>
  <rect x="44" y="143" width="84" height="18" rx="2" fill="#FFB200"/>
</svg>
