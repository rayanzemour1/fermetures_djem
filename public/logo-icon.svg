<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 205">
  <!-- Yellow shackle -->
  <path d="M 25 107 A 55 55 0 0 1 135 107"
        fill="none" stroke="#FFB200" stroke-width="22" stroke-linecap="butt"/>

  <!-- Blue body -->
  <rect x="8" y="97" width="144" height="108" fill="#000957"/>

  <!-- White frame / shutter pattern inside -->
  <!-- Top bar -->
  <rect x="8" y="97" width="144" height="11" fill="white"/>
  <!-- 2nd horizontal bar -->
  <rect x="8" y="117" width="144" height="8" fill="white"/>
  <!-- Left outer vertical -->
  <rect x="8" y="97" width="11" height="108" fill="white"/>
  <!-- Left inner vertical (short – creates the notched E shape) -->
  <rect x="29" y="108" width="9" height="52" fill="white"/>
  <!-- Middle horizontal (left side only) -->
  <rect x="8" y="151" width="56" height="9" fill="white"/>
  <!-- Right outer vertical -->
  <rect x="141" y="97" width="11" height="108" fill="white"/>
  <!-- Bottom bar -->
  <rect x="8" y="194" width="144" height="11" fill="white"/>

  <!-- Yellow shutter slats -->
  <rect x="46" y="127" width="83" height="16" rx="2" fill="#FFB200"/>
  <rect x="46" y="158" width="83" height="15" rx="2" fill="#FFB200"/>
</svg>
